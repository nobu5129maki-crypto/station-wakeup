name: Build Official Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'downloads/**'
      - 'public/downloads/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor Android
        run: npm run android:sync

      - name: Ensure hosted APK is not bundled into the app
        run: rm -rf android/app/src/main/assets/public/downloads

      - name: Build debug APK (sideload / 公式配布用)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare artifact
        run: |
          mkdir -p dist downloads public/downloads
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/station-wakeup.apk
          cp dist/station-wakeup.apk downloads/station-wakeup.apk
          cp dist/station-wakeup.apk public/downloads/station-wakeup.apk
          ls -lh dist/station-wakeup.apk downloads/station-wakeup.apk public/downloads/station-wakeup.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: station-wakeup-apk
          path: dist/station-wakeup.apk

      - name: Publish / update android-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Official Android App (latest)
          body: |
            Station WakeUp 公式 Android アプリ（APK）です。

            ## スマホでのダウンロード（推奨）
            サイト直リンク（GitHub経由より確実です）:
            https://station-wakeup.vercel.app/downloads/station-wakeup.apk

            ダウンロード専用ページ:
            https://station-wakeup.vercel.app/download.html

            - インストール後はホーム画面の **Station WakeUp** アイコンから起動してください
            - 本体バイブ・マイク検知がブラウザ版より確実です
            - 不明な提供元のインストールを許可する必要がある場合があります
          files: dist/station-wakeup.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit hosted APK for Vercel/GitHub Pages same-origin download
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/station-wakeup.apk public/downloads/station-wakeup.apk
          if git diff --staged --quiet; then
            echo "APK unchanged"
          else
            git commit -m "chore: update hosted official APK [skip ci]"
            git push
          fi

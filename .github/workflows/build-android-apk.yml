name: Build Official Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor Android
        run: npm run android:sync

      - name: Build debug APK (sideload / 公式配布用)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/station-wakeup.apk
          ls -lh dist/station-wakeup.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: station-wakeup-apk
          path: dist/station-wakeup.apk

      - name: Publish / update android-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Official Android App (latest)
          body: |
            Station WakeUp 公式 Android アプリ（APK）です。

            - インストール後はホーム画面の **Station WakeUp** アイコンから起動してください
            - 本体バイブ・マイク検知がブラウザ版より確実です
            - 不明な提供元のインストールを許可する必要がある場合があります

            ダウンロード: `station-wakeup.apk`
          files: dist/station-wakeup.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
